# DART SearXNG 配置 — 国内网络优化版（无需代理）

use_default_settings: true

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

server:
  secret_key: "dart_searxng_secret_key_2026_change_in_production"
  bind_address: "0.0.0.0"
  limiter: false

# 不使用代理，直连
outgoing:
  using_tor_proxy: false

ui:
  static_use_hash: true

# 仅启用墙内可直连的搜索引擎
engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    disabled: false
