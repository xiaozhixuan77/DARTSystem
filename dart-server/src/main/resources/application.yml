server:
  port: 8081

spring:
  application:
    name: dart-server
  profiles:
    active: dev

  # MySQL 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/dart?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: dart2024
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Spring AI
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 4096
    openai:
      api-key: ${EMBEDDING_API_KEY:not-needed}
      base-url: http://localhost:11434/v1
      embedding:
        options:
          model: bge-m3

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200
  refresh-token-expiration: 604800

# Agent 配置
agent:
  search:
    max-results: 8
    fetch-timeout-ms: 10000
    score-threshold: 3.0
  scoring:
    weights:
      timeliness: 0.15
      authority: 0.30
      depth: 0.20
      match: 0.35
  chunk:
    size: 500
    overlap: 50
    min-length: 20
  rag:
    similarity-threshold: 0.80
    top-k: 5

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
