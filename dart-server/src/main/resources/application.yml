server:
  port: 8081

spring:
  application:
    name: dart-server
  profiles:
    active: dev
  mvc:
    async:
      # SSE 异步请求超时（三节并行报告 + 追问，总时长约 90s）
      request-timeout: 180000
  autoconfigure:
    exclude:
      # Spring Boot 3.4.1 新包路径（与旧路径 autoconfigure 类冲突）
      - org.springframework.boot.http.client.autoconfigure.reactive.ReactiveHttpClientAutoConfiguration
      - org.springframework.boot.http.client.autoconfigure.HttpClientAutoConfiguration
      - org.springframework.boot.jackson.autoconfigure.JacksonAutoConfiguration
      - org.springframework.boot.restclient.autoconfigure.RestClientAutoConfiguration
      - org.springframework.boot.webclient.autoconfigure.WebClientAutoConfiguration
      - org.springframework.boot.http.converter.autoconfigure.HttpMessageConvertersAutoConfiguration
      - org.springframework.boot.http.codec.autoconfigure.CodecsAutoConfiguration

  # MySQL 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/dart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: dart2024
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Spring AI
  ai:
    model:
      chat: deepseek
    deepseek:
      # chat 走 DeepSeek 官网直营（V4-Flash 首 token 1.8s，硅基流动平台排队 19-107s）
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
          max-tokens: 4096
    openai:
      # embedding 继续走硅基流动（bge-m3 官网无此模型）
      api-key: ${SILICONFLOW_API_KEY:sk-placeholder}
      base-url: https://api.siliconflow.cn
      embedding:
        options:
          model: BAAI/bge-m3

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 会话清理配置
conversation:
  cleanup:
    max-conversations-per-user: 50

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200
  refresh-token-expiration: 604800

# 无登录模式：请求头 X-User-Id 缺省时的用户数据池 user id
app:
  default-user-id: 3

# Agent 配置
agent:
  llm:
    # LLM 单次调用读超时熔断（DeepSeek 高峰单节可达 100s，120s 降低部分节失败概率）
    read-timeout-ms: 120000
  cache:
    # 报告查询缓存有效期（相同查询直接命中返回）
    ttl-hours: 24
  sediment:
    # 报告自动沉淀：生成成功的报告写入用户知识库（RAG 预灌），相似查询直接命中
    enabled: true
    max-items-per-user: 50
  memory:
    # 会话长记忆（滚动摘要）：模糊输入解析、追问与报告生成注入会话上下文
    enabled: true
    # 滚动摘要字数上限（结构化 5 字段）
    summary-max-chars: 400
    # 增量压缩时的报告输入截断（防 token 膨胀）
    summary-report-chars: 4000
    # 续答路径加载的最近报告轮数
    recent-reports: 2
    # 每轮报告注入续答路径的截断字符数
    report-chars-per-round: 3000
  search:
    max-results: 6
    fetch-timeout-ms: 12000
    score-threshold: 1.5
    # 变体词主题校验阈值：与主词 embedding 余弦低于此值视为跑题，搜索前丢弃
    variant-similarity-threshold: 0.5
  scoring:
    weights:
      timeliness: 0.15
      authority: 0.30
      depth: 0.20
      match: 0.35
  chunk:
    size: 500
    overlap: 50
    min-length: 20
  curator:
    # 报告生成精读资源数：Top N 携带完整内容，其余仅摘要（控制 LLM 输入长度）
    deep-read-count: 4
  rag:
    similarity-threshold: 0.60
    top-k: 5
  graph:
    # 知识条目跨条目关联的向量相似度阈值（标题子串通道不依赖此阈值）
    link-similarity-threshold: 0.55

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
