server:
  port: 8081

spring:
  application:
    name: dart-server
  profiles:
    active: dev
  autoconfigure:
    exclude:
      # Spring AI 2.0.0 auto-config（RetryTemplate/RetryPolicy/RetryListener 类路径问题 + Jackson 3.x 不兼容）
      # 由 AiModelConfig 手动创建 ChatModel / EmbeddingModel Bean
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.embedding.observation.autoconfigure.EmbeddingObservationAutoConfiguration
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.redis.RedisVectorStoreAutoConfiguration
      # Spring Boot 3.4.1 新包路径（与旧路径 autoconfigure 类冲突）
      - org.springframework.boot.http.client.autoconfigure.reactive.ReactiveHttpClientAutoConfiguration
      - org.springframework.boot.http.client.autoconfigure.HttpClientAutoConfiguration
      - org.springframework.boot.jackson.autoconfigure.JacksonAutoConfiguration
      - org.springframework.boot.restclient.autoconfigure.RestClientAutoConfiguration
      - org.springframework.boot.webclient.autoconfigure.WebClientAutoConfiguration
      - org.springframework.boot.http.converter.autoconfigure.HttpMessageConvertersAutoConfiguration
      - org.springframework.boot.http.codec.autoconfigure.CodecsAutoConfiguration

  # MySQL 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/dart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: dart2024
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Spring AI
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${SILICONFLOW_API_KEY:sk-placeholder}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-V4-Flash
          temperature: 0.7
          max-tokens: 4096
    openai:
      api-key: ${SILICONFLOW_API_KEY:sk-placeholder}
      base-url: https://api.siliconflow.cn
      embedding:
        options:
          model: BAAI/bge-m3

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: ${JWT_SECRET:ZGV2LWRlZmF1bHQtc2VjcmV0LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbg==}
  access-token-expiration: 7200
  refresh-token-expiration: 604800

# Agent 配置
agent:
  search:
    max-results: 6
    fetch-timeout-ms: 10000
    score-threshold: 1.5
  scoring:
    weights:
      timeliness: 0.15
      authority: 0.30
      depth: 0.20
      match: 0.35
  chunk:
    size: 500
    overlap: 50
    min-length: 20
  rag:
    similarity-threshold: 0.80
    top-k: 5

# SearXNG
searxng:
  base-url: http://localhost:8080

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
