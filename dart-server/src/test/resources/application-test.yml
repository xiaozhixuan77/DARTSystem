# 集成测试配置
spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:mysql://localhost:3306/dart_test?serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: dart2024
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  autoconfigure:
    exclude:
      # Spring AI 2.0.0 自动配置（RetryTemplate 类路径问题）
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.embedding.observation.autoconfigure.EmbeddingObservationAutoConfiguration
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.redis.RedisVectorStoreAutoConfiguration
      # Spring Boot 3.4.1 新包路径自动配置（jar hell）
      - org.springframework.boot.http.client.autoconfigure.reactive.ReactiveHttpClientAutoConfiguration
      - org.springframework.boot.http.client.autoconfigure.HttpClientAutoConfiguration
      - org.springframework.boot.jackson.autoconfigure.JacksonAutoConfiguration
      - org.springframework.boot.restclient.autoconfigure.RestClientAutoConfiguration
      - org.springframework.boot.webclient.autoconfigure.WebClientAutoConfiguration
      - org.springframework.boot.http.converter.autoconfigure.HttpMessageConvertersAutoConfiguration

  ai:
    deepseek:
      api-key: test-key-not-real
    openai:
      api-key: test-key-not-real

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: dGhpc0lzQVRlc3RTZWNyZXRGb3JKV1RTaWduaW5nUHVycG9zZXM=
  access-token-expiration: 300
  refresh-token-expiration: 1800

agent:
  curator:
    jaccard-threshold: 0.85
  search:
    max-results: 5
    fetch-timeout-ms: 2000
    score-threshold: 3.0
  scoring:
    weights:
      timeliness: 0.15
      authority: 0.30
      depth: 0.20
      match: 0.35
  chunk:
    size: 500
    overlap: 50
    min-length: 20
  rag:
    similarity-threshold: 0.80
    top-k: 5

searxng:
  base-url: http://localhost:8080

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.dart: DEBUG
